name: sync-upstream

# El vigilante. Cada 8 horas mira si Arch movio gvfs o gnome-online-accounts,
# si GNOME publico un 2.74.x nuevo de libsoup, si Arch amplio sus parches, y si
# Solus cambio los flags que nos importan. La logica esta en
# scripts/sync-upstream.sh; aqui solo se decide que hacer con su resultado:
#
#   exit 0  -> nada que cambiar. Si hay avisos, issue. Cierra los que ya no apliquen.
#   exit 11 -> cambios rutinarios: construye y verifica la cadena en un Arch
#              limpio y hace push a main. Las maquinas lo recogen con su
#              temporizador (drive-gekko-repo.timer): el repo es privado, los
#              binarios no se publican en GitHub.
#   exit 10 -> cambios que necesitan una persona: construye y verifica para
#              demostrar que funciona, y abre un PR.
#   exit 20 -> fallo interno: descarta lo editado, issue, run en rojo.
#
# Configuracion unica en GitHub (Settings -> Actions -> General):
#   - Workflow permissions: "Read and write permissions"
#   - marcar "Allow GitHub Actions to create and approve pull requests"
# Sin eso, el push y el PR fallan con 403 en el primer run.
#
# Minutos de Actions (repo privado, cuota mensual): un run sin cambios son
# unos 3 minutos; con build, 15-20. Cada 8 h son ~90 runs al mes.

on:
  schedule:
    - cron: '17 */8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: vigilar y actualizar
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: archlinux:base-devel
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: git para el checkout
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Sy --noconfirm git

      - uses: actions/checkout@v7

      - name: preparar el contenedor
        run: ./scripts/ci-prepare.sh

      - name: etiqueta del bot
        run: gh label create sync-bot --description "abierto por el sincronizador" --color 0E8A16 2>/dev/null || true

      - name: sincronizar
        id: sync
        shell: bash
        run: |
          code=0
          sudo -u builder env HOME=/home/builder ./scripts/sync-upstream.sh --apply || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [[ -f sync-state.env ]]; then cat sync-state.env >> "$GITHUB_OUTPUT"; else echo "WARNINGS=0" >> "$GITHUB_OUTPUT"; fi
          echo "== resultado: $code =="; cat sync-report.md 2>/dev/null || true

      # Cualquier cosa que no sea 0/10/11 es un fallo del propio bot: descartar
      # lo que haya editado, avisar y dejar el run en rojo.
      - name: fallo interno del sincronizador
        if: steps.sync.outputs.code != '0' && steps.sync.outputs.code != '10' && steps.sync.outputs.code != '11'
        shell: bash
        run: |
          git checkout -- packages upstream 2>/dev/null || true
          title="sync: fallo interno del sincronizador (codigo ${{ steps.sync.outputs.code }})"
          { echo "El sincronizador termino con el codigo ${{ steps.sync.outputs.code }}. No se ha tocado main."; echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; echo
            cat sync-report.md 2>/dev/null || echo "(sin informe)"; } > /tmp/body.md
          n="$(gh issue list --label sync-bot --state open --search "in:title \"$title\"" --json number --jq '.[0].number' || true)"
          if [[ -n "$n" ]]; then gh issue comment "$n" --body-file /tmp/body.md; else gh issue create --title "$title" --label sync-bot --body-file /tmp/body.md; fi
          exit 1

      # Hay un bump -> construir la cadena entera y verificarla. Si falla,
      # issue y NADA se pushea.
      - name: construir e instalar la cadena
        id: build
        if: steps.sync.outputs.code == '10' || steps.sync.outputs.code == '11'
        shell: bash
        continue-on-error: true
        run: |
          sudo -u builder env HOME=/home/builder ./scripts/build-all.sh --install
          ./scripts/verify-chain.sh
          ./scripts/publish-repo.sh --check

      - name: abrir issue (el bump no construye)
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          git checkout -- packages upstream 2>/dev/null || true
          title="sync: el bump automatico no construye"
          { echo "El sincronizador aplico un bump pero la cadena no construye o no verifica. No se ha tocado main."; echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; echo
            cat sync-report.md; } > /tmp/body.md
          n="$(gh issue list --label sync-bot --state open --search "in:title \"$title\"" --json number --jq '.[0].number' || true)"
          if [[ -n "$n" ]]; then gh issue comment "$n" --body-file /tmp/body.md; else gh issue create --title "$title" --label sync-bot --body-file /tmp/body.md; fi
          exit 1

      # exit 11: rutinario -> commit y push a main (con rebase por si main avanzo)
      - name: push a main (rutinario)
        if: steps.sync.outputs.code == '11' && steps.build.outcome == 'success'
        shell: bash
        run: |
          git add packages upstream
          { echo "sync: actualizacion rutinaria"; echo; cat sync-report.md; echo
            echo "Construido y verificado en ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; } > /tmp/msg.txt
          git commit -F /tmp/msg.txt
          git pull --rebase origin main
          git push origin HEAD:main

      # exit 10: necesita revision -> PR con el build ya en verde (enlazado en
      # el cuerpo: un PR abierto por el bot NO tiene checks propios)
      - name: preparar cuerpo del PR
        if: steps.sync.outputs.code == '10' && steps.build.outcome == 'success'
        shell: bash
        run: |
          { cat sync-report.md; echo
            echo "### Como revisarlo"
            echo "1. La cadena entera construyo, instalo y verifico en un Arch limpio en este run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "   (un PR abierto por el bot no dispara checks propios: ese enlace es la prueba)"
            echo "2. El diff toca solo pkgver/pkgrel/checksum (o _cvecommit) del paquete anunciado, y/o snapshots en upstream/solus/."
            echo "3. Si quieres probarlo antes: \`gh pr checkout <n>\` y \`sudo systemctl start drive-gekko-repo.service\` en tu maquina (construye de esa rama)."
            echo; echo "Al pulsar **Merge**, el temporizador de cada maquina lo recoge en su siguiente vuelta."; } > /tmp/pr-body.md

      - name: abrir PR
        if: steps.sync.outputs.code == '10' && steps.build.outcome == 'success'
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            packages/**
            upstream/**
          commit-message: 'sync: actualizacion que necesita revision'
          branch: bot/sync-upstream
          delete-branch: true
          title: 'sync: actualizacion upstream (revisar y mergear)'
          body-path: /tmp/pr-body.md
          labels: sync-bot

      # exit 0 con snapshots de Solus cambiados: se guardan (commit pequeno)
      - name: guardar snapshots de Solus
        if: steps.sync.outputs.code == '0'
        shell: bash
        run: |
          git add upstream
          if git diff --cached --quiet; then echo "sin cambios en upstream/"; exit 0; fi
          git commit -m "upstream: snapshot de Solus actualizado"
          git pull --rebase origin main && git push origin HEAD:main

      # Avisos (Solus cambio un flag, algo no se pudo leer...): issue deduplicado.
      - name: abrir issue (avisos)
        if: (steps.sync.outputs.code == '0' || steps.sync.outputs.code == '11' || steps.sync.outputs.code == '10') && steps.sync.outputs.WARNINGS != '0'
        shell: bash
        run: |
          title="sync: avisos que necesitan una persona"
          { echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; echo; cat sync-report.md; } > /tmp/body.md
          n="$(gh issue list --label sync-bot --state open --search "in:title \"$title\"" --json number --jq '.[0].number' || true)"
          if [[ -n "$n" ]]; then gh issue comment "$n" --body-file /tmp/body.md; else gh issue create --title "$title" --label sync-bot --body-file /tmp/body.md; fi

      - name: cerrar issues del bot que ya no aplican
        if: steps.sync.outputs.code == '0' && steps.sync.outputs.WARNINGS == '0'
        shell: bash
        run: |
          gh issue list --label sync-bot --state open --json number --jq '.[].number' | while read -r n; do
            gh issue close "$n" --comment "El sincronizador ya no detecta este problema. Cerrado automaticamente."
          done || true
