name: build

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'scripts/**'
      - 'pacman-hooks/**'
      - 'systemd/**'
      - 'install.sh'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'packages/**'
      - 'scripts/**'
      - 'pacman-hooks/**'
      - 'systemd/**'
      - 'install.sh'
      - '.github/workflows/build.yml'
  # Los pines (gvfs=, libgoa=) apuntan a [extra]. Cuando Arch los mueva, este
  # job se pone en rojo aunque nadie haya tocado el repo: eso es lo que se
  # quiere, y por eso corre tambien solo, cada lunes.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Un grupo por rama: los PR no se hacen cola con main.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: archlinux:base-devel
    steps:
      - name: Actualizar sistema
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm namcap git

      - uses: actions/checkout@v7

      - name: bash -n + namcap
        run: ./scripts/lint.sh

      - name: sintaxis de los scripts
        run: |
          for f in install.sh scripts/*.sh pacman-hooks/*.sh; do
            echo "==> $f"
            bash -n "$f"
          done

      - name: la unidad systemd es valida
        run: systemd-analyze verify --user systemd/drive-gekko-check.service || true

  chain:
    name: construir la cadena completa
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: archlinux:base-devel
    steps:
      - name: git para el checkout
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Sy --noconfirm git

      - uses: actions/checkout@v7

      # Mismo script que usa el sincronizador: los dos workflows preparan el
      # contenedor exactamente igual.
      - name: preparar el contenedor
        run: ./scripts/ci-prepare.sh

      # Traduce la deriva de [extra] a un error legible ANTES de compilar nada.
      - name: los pines siguen en [extra]
        shell: bash
        run: |
          pin() { grep -m1 '^pkgver=' "packages/$1/PKGBUILD" | cut -d= -f2; }
          ok=1
          for spec in "gvfs=$(pin gvfs-google)" "gvfs-goa=$(pin gvfs-google)" "libgoa=$(pin gnome-online-accounts)"; do
            if pacman -Sp "$spec" >/dev/null 2>&1; then
              echo "ok  $spec"
            else
              have="$(LC_ALL=C pacman -Si "${spec%%=*}" | awk -F': *' '/^Version/{print $2; exit}')"
              echo "::error::$spec ya no esta en [extra] (ahora: $have). Hay que subir pkgver en el PKGBUILD y regenerar el checksum. Ver docs/mantenimiento.md."
              ok=0
            fi
          done
          (( ok ))

      # El MISMO script que usan el propietario y el sincronizador. El orden
      # no es decorativo: libgdata necesita las cabeceras de libsoup2 ya
      # instaladas, y gvfs-google las de libgdata. Sin --needed (pacman
      # omitiria nuestro GOA si el de Arch ya estuviera con la misma version).
      - name: libsoup2 -> libgdata -> gvfs-google -> gnome-online-accounts
        run: sudo -u builder env HOME=/home/builder ./scripts/build-all.sh --install

      # Las comprobaciones que de verdad dicen si esto sirve (mismo script
      # que install.sh y el sincronizador).
      - name: verificar el resultado
        run: |
          ./scripts/verify-chain.sh
          bash pacman-hooks/post-upgrade-check.sh
          # el repo local que generaria una maquina: lista blanca + pacman lo lee
          ./scripts/publish-repo.sh --check

      - name: namcap sobre los paquetes construidos
        shell: bash
        run: |
          shopt -s nullglob
          for p in out/*.pkg.tar.zst; do
            echo "::group::$(basename "$p")"
            namcap "$p" || true
            echo "::endgroup::"
          done


  optional:
    name: deja-dup (opcional, referencia)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    container:
      image: archlinux:base-devel
    steps:
      - name: Actualizar sistema
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm git sudo
      - uses: actions/checkout@v7
      - name: Preparar usuario de build
        run: |
          useradd -m builder
          install -m 0440 /dev/stdin /etc/sudoers.d/builder <<< 'builder ALL=(ALL) NOPASSWD: ALL'
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: makepkg deja-dup
        run: |
          cd packages/deja-dup
          sudo -u builder makepkg --syncdeps --noconfirm --cleanbuild --nocheck
